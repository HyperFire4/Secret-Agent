<!DOCTYPE html>
<!--
  SECRET AGENT — a Spyfall / Undercover style party game. Single file, no build step.

  HOSTING: put this file in a GitHub repo as index.html -> Settings > Pages > Deploy from branch (main, /root).
  ONLINE MODE: uses PeerJS (WebRTC). The host's phone acts as the server; friends join with the 4-letter code.
  OFFLINE MODE: "Pass the Phone" needs no network after the page has loaded.

  CUSTOMISE:
   - Add a category or words: edit the CATS object in the <script> below.
   - Change default timer: edit `mins` in newGame().  Timer buttons: edit the [3,5,8,10] list in lobby().
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Secret Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Secret Agent</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Palette taken from the logo: gunmetal steel + rusted orange */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(110% 50% at 50% -8%,#30363d 0,transparent 62%),repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 4px),var(--bg);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
h1,h2,.btn,.timer,.code,.win,.mini,.codein,.hold{font-family:"Chakra Petch","Barlow",system-ui,sans-serif}
h1{font-size:30px;line-height:1.15;margin:10px 0 6px}
h2{font-size:18px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:14px}
.tag{text-align:center;color:var(--mut);margin:14px 0 4px}
.card{background:linear-gradient(180deg,var(--steel2),var(--steel));border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 30px -18px #000}
.err{background:#3a1a1c;border-color:#6b2a2e;color:#ffc9c4}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.row h2{margin:0}
.mini{border:1px solid var(--rust);background:rgba(240,138,44,.1);color:#ffcf9c;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;margin:10px 0;font-size:17px;font-weight:700;color:#1b1006;background:linear-gradient(180deg,#ffa447,var(--rust));box-shadow:0 4px 0 var(--rust2),0 16px 26px -14px rgba(240,138,44,.6);cursor:pointer;transition:transform .12s,box-shadow .12s}

.pl:last-child{border:0}

.dot{width:10px;height:10px;border-radius:50%;background:var(--rust);animation:beat 1.2s infinite}
.win{font-size:36px;font-weight:700;text-align:center;margin:18px 0 6px;transform:rotate(-3deg)}
.link{text-align:center;color:var(--mut);font-size:14px;margin-top:20px;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes beat{50%{transform:scale(1.07)}}
@keyframes logo{from{opacity:0;transform:scale(.93);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-9deg)}60%{opacity:1;transform:scale(.93) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}

#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<script>
/* ===================== WORD CATEGORIES =====================
   To add a category: copy a block, give it a name, an emoji icon, a words list and (optional) pairs.
   - words: 12 to 16 words work best. Classic mode picks one as the secret; everyone sees the full list.
   - pairs: used by Undercover mode. Each pair is two SIMILAR words (agents get one, the spy gets the other).
     Both words in a pair must also appear in the words list. If you leave pairs out,
     Undercover just picks two random words from the category. */
const CATS = {
  "Popular Places": {icon:"📍",
    words:["Airport","Beach","Casino","Hospital","Library","Cinema","School","Supermarket","Zoo","Train Station","Hotel","Bank","Circus","Space Station","Pirate Ship","Gym"],
    pairs:[["Airport","Train Station"],["Library","School"],["Cinema","Casino"],["Bank","Supermarket"],["Hospital","Hotel"]]},
  "Movies": {icon:"🎬",
    words:["Titanic","Avengers","Inception","Frozen","Shrek","Jaws","Sholay","3 Idiots","Lion King","Toy Story","Matrix","Jurassic Park","Dangal","Harry Potter","Interstellar","Baahubali"],
    pairs:[["Inception","Interstellar"],["3 Idiots","Dangal"],["Frozen","Lion King"],["Toy Story","Shrek"],["Matrix","Inception"],["Avengers","Harry Potter"]]},
  "Food & Dishes": {icon:"🍕",
    words:["Pizza","Burger","Biryani","Sushi","Pasta","Tacos","Dosa","Pav Bhaji","Samosa","Ramen","Pancakes","Fries","Paneer Tikka","Ice Cream","Sandwich","Noodles"],
    pairs:[["Pizza","Burger"],["Pasta","Noodles"],["Dosa","Pancakes"],["Sushi","Ramen"],["Sandwich","Burger"],["Biryani","Paneer Tikka"]]},
  "Superheroes": {icon:"🦸",
    words:["Superman","Batman","Spider-Man","Iron Man","Thor","Hulk","Wonder Woman","Black Panther","Captain America","Flash","Aquaman","Wolverine","Doctor Strange","Deadpool","Shaktiman","Krrish"],
    pairs:[["Superman","Shaktiman"],["Batman","Iron Man"],["Thor","Hulk"],["Spider-Man","Deadpool"],["Captain America","Black Panther"],["Krrish","Shaktiman"]]},
  "Animals": {icon:"🐾",
    words:["Lion","Elephant","Dolphin","Penguin","Tiger","Giraffe","Kangaroo","Panda","Wolf","Eagle","Shark","Monkey","Camel","Octopus","Peacock","Crocodile"],
    pairs:[["Lion","Tiger"],["Dolphin","Shark"],["Eagle","Peacock"],["Wolf","Lion"],["Crocodile","Shark"],["Elephant","Giraffe"]]},
  "Sports": {icon:"⚽",
    words:["Cricket","Football","Tennis","Badminton","Hockey","Basketball","Kabaddi","Chess","Swimming","Boxing","Golf","Volleyball","Baseball","Rugby","Table Tennis","Archery"],
    pairs:[["Cricket","Baseball"],["Tennis","Badminton"],["Tennis","Table Tennis"],["Football","Rugby"],["Basketball","Volleyball"],["Boxing","Kabaddi"]]},
  "Indian Cities": {icon:"🏙️",
    words:["Mumbai","Delhi","Bengaluru","Kolkata","Chennai","Jaipur","Goa","Varanasi","Hyderabad","Pune","Agra","Udaipur","Shimla","Kochi","Ahmedabad","Amritsar"],
    pairs:[["Mumbai","Delhi"],["Jaipur","Udaipur"],["Pune","Bengaluru"],["Chennai","Kochi"],["Goa","Kochi"],["Agra","Varanasi"],["Shimla","Amritsar"]]},
  "Festivals": {icon:"🪔",
    words:["Diwali","Holi","Eid","Navratri","Christmas","Ganesh Chaturthi","Raksha Bandhan","Pongal","Onam","Lohri","Dussehra","Makar Sankranti","New Year","Halloween","Valentine’s Day","Durga Puja"],
    pairs:[["Diwali","Christmas"],["Navratri","Durga Puja"],["Dussehra","Diwali"],["Pongal","Makar Sankranti"],["Lohri","Makar Sankranti"],["Onam","Pongal"],["Holi","Halloween"]]},
  "Jobs & Professions": {icon:"💼",
    words:["Doctor","Teacher","Pilot","Chef","Police Officer","Engineer","Lawyer","Farmer","Actor","Cricketer","Astronaut","Barber","Singer","Judge","Nurse","Photographer"],
    pairs:[["Doctor","Nurse"],["Pilot","Astronaut"],["Actor","Singer"],["Police Officer","Judge"],["Chef","Farmer"],["Lawyer","Judge"],["Actor","Photographer"]]},
  "Street Food & Snacks": {icon:"🥟",
    words:["Pani Puri","Vada Pav","Bhel Puri","Samosa","Jalebi","Momos","Kachori","Pakora","Dhokla","Chai","Maggi","Kulfi","Aloo Tikki","Dabeli","Frankie","Sev Puri"],
    pairs:[["Pani Puri","Sev Puri"],["Samosa","Kachori"],["Vada Pav","Dabeli"],["Jalebi","Kulfi"],["Pakora","Aloo Tikki"],["Bhel Puri","Sev Puri"],["Momos","Frankie"]]},
  "Cricket": {icon:"🏏",
    words:["Virat Kohli","MS Dhoni","Rohit Sharma","Sachin Tendulkar","Jasprit Bumrah","Hardik Pandya","Ravindra Jadeja","KL Rahul","Mumbai Indians","CSK","RCB","KKR","Gujarat Titans","Lord’s","Wankhede","Eden Gardens"],
    pairs:[["Virat Kohli","Rohit Sharma"],["MS Dhoni","Sachin Tendulkar"],["Mumbai Indians","CSK"],["RCB","KKR"],["Wankhede","Eden Gardens"],["Hardik Pandya","Ravindra Jadeja"]]},
  "Bollywood Stars": {icon:"⭐",
    words:["Shah Rukh Khan","Salman Khan","Aamir Khan","Amitabh Bachchan","Deepika Padukone","Alia Bhatt","Ranbir Kapoor","Ranveer Singh","Priyanka Chopra","Akshay Kumar","Hrithik Roshan","Katrina Kaif","Kareena Kapoor","Kartik Aaryan","Varun Dhawan","Shraddha Kapoor"],
    pairs:[["Shah Rukh Khan","Salman Khan"],["Deepika Padukone","Alia Bhatt"],["Ranbir Kapoor","Ranveer Singh"],["Hrithik Roshan","Akshay Kumar"],["Katrina Kaif","Kareena Kapoor"],["Aamir Khan","Amitabh Bachchan"],["Kartik Aaryan","Varun Dhawan"]]},
  "Apps & Gadgets": {icon:"📱",
    words:["Instagram","WhatsApp","YouTube","Snapchat","Spotify","Netflix","Google Maps","Zomato","Swiggy","Uber","Amazon","Telegram","iPhone","Laptop","Smartwatch","Earbuds"],
    pairs:[["Instagram","Snapchat"],["WhatsApp","Telegram"],["Zomato","Swiggy"],["Netflix","YouTube"],["Uber","Google Maps"],["Smartwatch","Earbuds"],["iPhone","Laptop"]]},
  "College Life": {icon:"🎓",
    words:["Canteen","Hostel","Backbencher","Viva","Attendance","Library","Fest","Assignment","Placement","Hackathon","Lab","Exam Hall","Group Project","Mess Food","Notes","Bunking"],
    pairs:[["Canteen","Mess Food"],["Viva","Exam Hall"],["Assignment","Group Project"],["Hackathon","Fest"],["Attendance","Bunking"],["Placement","Hackathon"],["Lab","Library"]]},
  "Landmarks": {icon:"🗼",
    words:["Eiffel Tower","Taj Mahal","Statue of Liberty","Great Wall","Pyramids","Big Ben","Colosseum","Burj Khalifa","Sydney Opera House","Mount Everest","Niagara Falls","Machu Picchu","Golden Gate Bridge","Leaning Tower","Red Fort","Gateway of India"],
    pairs:[["Eiffel Tower","Big Ben"],["Taj Mahal","Red Fort"],["Colosseum","Pyramids"],["Statue of Liberty","Golden Gate Bridge"],["Burj Khalifa","Sydney Opera House"],["Gateway of India","Red Fort"],["Niagara Falls","Mount Everest"]]}
};

/* ===================== STATE ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const PRE = 'secretagent-';
const CN = Object.keys(CATS);
let G = null;            // full game state — exists only on the host's phone (or in Pass-the-Phone mode)
let V = null;            // the view this device renders (what this player is allowed to see)
let peer = null, conn = null;
let screen = 'home', err = '', N = '', C = '', held = false, guessing = false;

function newGame(local){
  return {local, code:'', players:[], phase:'lobby', votes:{}, pi:0,
          cfg:{cats:[CN[0]], sub:'classic', mins:8}};   // <- default timer minutes
}

/* ===================== HOST LOGIC ===================== */
const nm = id => (G.players.find(p => p.id === id) || {}).name || '?';

function roleFor(id){
  if(!G.secret || id == null) return null;
  const spy = id === G.spy;
  if(G.cfg.sub === 'classic')
    return spy ? {spy:true, text:'YOU ARE THE SPY', sub:'Category: '+G.cat+'. Work out the secret word!'}
               : {text:G.secret, sub:'Category: '+G.cat+'. Find the Spy!'};
  return {text: spy ? G.alt : G.secret, sub:'Your secret word. Blend in!'};
}

// Builds what ONE player may see — secrets of other players never leave the host.
function view(id){
  const g = G;
  return {phase:g.phase, local:g.local, code:g.code, cfg:g.cfg, endAt:g.endAt, cat:g.cat, words:g.words, pi:g.pi, you:id,
    host:id === 'host',
    players:g.players.map(p => ({id:p.id, name:p.name, voted:p.id in g.votes, gone:p.gone})),
    role: g.local ? (g.phase === 'pass' ? roleFor(g.players[g.pi].id) : null) : roleFor(id),
    canGuess: !g.local && g.cfg.sub === 'classic' && id === g.spy && g.phase === 'play',
    result: g.phase === 'over' ? g.result : null};
}

function sync(){
  if(!G) return;
  G.players.forEach(p => { if(p.conn && p.conn.open) p.conn.send({t:'s', v:view(p.id)}); });
  V = view('host'); screen = 'game'; render();
}

function startGame(){
  if(G.players.length < 3 || !G.cfg.cats.length) return;
  G.cat = rnd(G.cfg.cats); G.words = CATS[G.cat].words;
  const P = CATS[G.cat].pairs;
  if(G.cfg.sub === 'undercover' && P){                      // Undercover: use a hand-picked similar pair
    const pr = rnd(P), sw = Math.random() < .5;
    G.secret = pr[sw ? 1 : 0]; G.alt = pr[sw ? 0 : 1];
  } else { G.secret = rnd(G.words); do { G.alt = rnd(G.words); } while(G.alt === G.secret); }
  G.spy = rnd(G.players).id; G.votes = {}; G.result = null; G.pi = 0;
  G.endAt = Date.now() + G.cfg.mins * 60000;
  G.phase = G.local ? 'pass' : 'play'; guessing = false; sync();
}

function startVote(){ G.phase = 'vote'; G.votes = {}; sync(); }

function finish(win, why, t){
  G.phase = 'over';
  G.result = {win, why, spy:nm(G.spy), secret:G.secret, cat:G.cat,
              alt: G.cfg.sub === 'undercover' ? G.alt : null,
              tally: Object.entries(t || {}).map(([k,n]) => [nm(k), n])};
  sync();
}

function resolve(){
  const t = {}; Object.values(G.votes).forEach(v => t[v] = (t[v] || 0) + 1);
  const mx = Math.max(0, ...Object.values(t));
  const top = Object.keys(t).filter(k => t[k] === mx);
  const caught = top.length === 1 ? top[0] : null;
  if(caught === G.spy) finish('agents', 'The Spy was caught!', t);
  else finish('spy', caught ? nm(caught)+' was innocent. The Spy escapes!' : 'The vote was tied. The Spy escapes!', t);
}

// every player action (host's own or received over the network) goes through here
function act(id, m){
  const g = G, h = id === 'host';
  if(m.t === 'call' && g.phase === 'play') startVote();
  else if(m.t === 'vote' && g.phase === 'vote'){
    g.votes[id] = m.to;
    if(g.local || g.players.every(p => p.gone || p.id in g.votes)) resolve(); else sync();
  }
  else if(m.t === 'guess' && g.phase === 'play' && id === g.spy && g.cfg.sub === 'classic'){
    const ok = m.w === g.secret;
    finish(ok ? 'spy' : 'agents', ok ? 'The Spy guessed the word: '+g.secret+'!' : 'The Spy guessed "'+m.w+'". Wrong!');
  }
  else if(m.t === 'force' && h && g.phase === 'vote') resolve();
  else if(m.t === 'again' && h){ g.phase = 'lobby'; g.secret = null; g.votes = {}; g.result = null; guessing = false; sync(); }
  else if(m.t === 'next' && h && g.local && g.phase === 'pass'){
    if(++g.pi >= g.players.length){ g.phase = 'play'; g.endAt = Date.now() + g.cfg.mins * 60000; }
    sync();
  }
}

const send = m => G ? act('host', m) : conn && conn.send(m);

/* ===================== NETWORKING ===================== */
function fail(msg){
  err = msg; try{ peer && peer.destroy(); }catch(e){}
  peer = conn = G = V = null; screen = 'home'; render();
}

function create(){
  G = newGame(false);
  const attempt = () => {
    const code = Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
    peer = new Peer(PRE + code);
    peer.on('open', () => { G.code = code; G.players = [{id:'host', name:N.trim()}]; sync(); });
    peer.on('connection', hostConn);
    peer.on('error', e => { if(e.type === 'unavailable-id'){ peer.destroy(); attempt(); } else fail('Could not create room ('+e.type+'). Try again.'); });
  };
  attempt();
}

function hostConn(c){
  let p = null;
  c.on('data', m => {
    if(m.t === 'join'){
      if(G.phase !== 'lobby') return c.send({t:'err', m:'That game has already started.'});
      if(G.players.length >= 12) return c.send({t:'err', m:'Room is full (12 players max).'});
      let name = String(m.name || 'Player').trim().slice(0,14) || 'Player', base = name, i = 2;
      while(G.players.some(x => x.name === name)) name = base+' '+(i++);
      p = {id:c.peer, name, conn:c}; G.players.push(p); sync();
    } else if(p) act(p.id, m);
  });
  c.on('close', () => {
    if(!p) return;
    if(G.phase === 'lobby') G.players = G.players.filter(x => x !== p); else p.gone = true;
    if(G.phase === 'vote' && G.players.every(x => x.gone || x.id in G.votes)) resolve(); else sync();
  });
}

function join(){
  peer = new Peer();
  const timer = setTimeout(() => { if(screen === 'busy') fail('Could not reach the room. Check the code and your connection.'); }, 12000);
  peer.on('error', e => fail(e.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Connection error ('+e.type+').'));
  peer.on('open', () => {
    conn = peer.connect(PRE + C, {reliable:true});
    conn.on('open', () => conn.send({t:'join', name:N.trim()}));
    conn.on('data', m => {
      if(m.t === 's'){ clearTimeout(timer); if(V && V.phase !== 'play' && m.v.phase === 'play') guessing = false; V = m.v; screen = 'game'; render(); }
      if(m.t === 'err') fail(m.m);
    });
    conn.on('close', () => fail('Disconnected from the host.'));
  });
}

/* ===================== UI ACTIONS ===================== */
function doCreate(){ if(!N.trim()) return flash('Enter your name first.'); saveName(); err = ''; screen = 'busy'; render(); create(); }
function doJoin(){
  if(!N.trim()) return flash('Enter your name first.');
  if(C.length !== 4) return flash('Room codes have 4 letters.');
  saveName(); err = ''; screen = 'busy'; render(); join();
}
function flash(m){ err = m; render(); }
function doLocal(){
  const names = [...new Set($('#names').value.split(/[\n,]/).map(s => s.trim().slice(0,14)).filter(Boolean))];
  if(names.length < 3 || names.length > 12) return flash('Enter 3 to 12 different names.');
  err = ''; G = newGame(true); G.players = names.map((n,i) => ({id:'p'+i, name:n})); sync();
}
function tc(i){
  const l = G.cfg.cats, c = CN[i];
  if(l.includes(c)) l.splice(l.indexOf(c), 1); else l.push(c);
  sync();
}
function setSub(s){ G.cfg.sub = s; sync(); }
function setMins(m){ G.cfg.mins = m; sync(); }
function vt(i){ send({t:'vote', to:V.players[i].id}); }
function wc(i, el){
  if(guessing){ const w = V.words[i]; if(confirm('Final guess: "'+w+'"?')){ guessing = false; send({t:'guess', w}); } }
  else el.classList.toggle('x');
}

/* ===================== RENDERING ===================== */
let lastKey = '';
function render(){
  const a = $('#app'), ph = V ? V.phase : '';
  const brand = (screen === 'local' || screen === 'busy' || (screen === 'game' && (ph === 'lobby' || ph === 'over')))
    ? `<div class="brand"><img src="${LOGO}" alt="Secret Agent"></div>` : '';
  a.innerHTML = brand + (screen === 'home' ? home() : screen === 'local' ? localSetup()
    : screen === 'busy' ? '<div class="card"><h2><span class="dot"></span>Connecting…</h2><p class="mut">Contacting the room.</p></div>'
    : V ? game() : '');
  const k = screen + ph;                       // play the entrance animation only when the screen changes
  if(k !== lastKey){ lastKey = k; a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter'); if(ph === 'vote') buzz([150,80,150]); if(ph === 'over') buzz(300); }
  if(ph === 'play') keepAwake();
}

const errBox = () => err ? `<div class="card err">${esc(err)}</div>` : '';

function home(){ return `
  <div class="hero"><img src="${LOGO}" alt="Secret Agent"></div>
  <p class="tag">One of you is the spy. Find them, or blend in.</p>${errBox()}
  <div class="card"><h2>Play on separate phones</h2>
    <input placeholder="Your name" maxlength="14" value="${esc(N)}" oninput="N=this.value" autocomplete="off">
    <button class="btn" onclick="doCreate()">Create room</button>
    <div class="or">or join a friend’s room</div>
    <input class="codein" placeholder="CODE" maxlength="4" value="${esc(C)}" autocapitalize="characters" autocomplete="off"
      oninput="C=this.value.toUpperCase().replace(/[^A-Z]/g,'');this.value=C">
    <button class="btn alt" onclick="doJoin()">Join room</button></div>
  <button class="btn alt" onclick="screen='local';err='';render()">📱 Pass the phone (one device, offline)</button>
  ${installBox()}`; }

function localSetup(){ return `
  <h1>Pass the phone</h1><p class="mut">Everyone shares this phone. Each player secretly views their role in turn.</p>${errBox()}
  <div class="card"><h2>Players</h2><textarea id="names" rows="6" placeholder="One name per line (3 to 12)"></textarea></div>
  <button class="btn" onclick="doLocal()">Continue</button>
  <button class="btn alt" onclick="screen='home';err='';render()">Back</button>`; }

function holdBox(r){
  if(!r) return '';
  return `<div class="hold${held ? ' on' : ''}" data-hold>
    <div class="lbl"><div style="font-size:36px">🔒</div>Press &amp; hold<br>to reveal secret</div>
    <div class="sec"><div class="${r.spy ? 'spy' : ''}" style="font-size:${r.text.length > 14 ? 24 : 34}px">${esc(r.text)}</div>
    <div class="mut" style="font-weight:400;margin-top:8px">${esc(r.sub)}</div></div></div>`;
}

function game(){
  return {lobby, pass, play, vote, over}[V.phase]();
}

function lobby(){
  const c = V.cfg, cl = c.sub === 'classic', full = c.cats.length === CN.length;
  const leave = '<div class="link" onclick="location.reload()">Leave game</div>';
  const list = `<div class="card"><h2>Players (${V.players.length})</h2>${V.players.map(p =>
    `<div class="pl"><span class="nm">${av(p.name)}${esc(p.name)}${p.id === V.you && !V.local ? '&nbsp;<i class="mut">(you)</i>' : ''}</span><span class="mut">${p.id === 'host' && !V.local ? '👑 host' : ''}</span></div>`).join('')}</div>`;
  const head = V.local ? '<h1>Game setup</h1>'
    : `<div class="card"><div class="mut" style="text-align:center">Room code</div><div class="code">${[...V.code].map(x => `<b>${x}</b>`).join('')}</div>
       <button class="btn alt" onclick="inv(this)">🔗 Share invite link</button></div>`;
  if(!V.host) return head + list + `<div class="card"><h2><span class="dot"></span>Waiting for the host…</h2>
    <p class="mut">${cl ? 'Classic Spyfall' : 'Undercover'} · ${c.mins} min · ${c.cats.length} categor${c.cats.length === 1 ? 'y' : 'ies'}</p></div>` + leave;
  const ready = V.players.length >= 3 && c.cats.length > 0;
  return head + list + `
  <div class="card"><div class="row"><h2>Categories <span class="mut">${c.cats.length}/${CN.length}</span></h2>
    <button class="mini" onclick="selAll()">${full ? 'Deselect all' : 'Select all'}</button></div>
    <div class="chips">${CN.map((x,i) =>
    `<div class="chip${c.cats.includes(x) ? ' on' : ''}" onclick="tc(${i})">${CATS[x].icon} ${esc(x)}</div>`).join('')}</div></div>
  <div class="card"><h2>Mode</h2><div class="chips">
    <div class="chip${cl ? ' on' : ''}" onclick="setSub('classic')">🕵️ Classic Spyfall</div>
    <div class="chip${cl ? '' : ' on'}" onclick="setSub('undercover')">🎭 Undercover</div></div>
    <p class="mut">${cl ? 'Agents get the secret word. The Spy only sees “YOU ARE THE SPY”.' : 'Agents get one word, the Spy secretly gets a very similar one and doesn’t know it.'}</p></div>
  <div class="card"><h2>Timer</h2><div class="chips">${[3,5,8,10].map(m =>
    `<div class="chip${c.mins === m ? ' on' : ''}" onclick="setMins(${m})">${m} min</div>`).join('')}</div></div>
  <button class="btn" onclick="startGame()" ${ready ? '' : 'disabled'}>Start game</button>
  ${V.players.length < 3 ? '<p class="mut" style="text-align:center">Need at least 3 players.</p>' : !c.cats.length ? '<p class="mut" style="text-align:center">Pick at least one category.</p>' : ''}` +
  (V.local ? '<button class="btn alt" onclick="G=null;V=null;screen=\'local\';render()">Change players</button>' : '') + leave;
}

function pass(){
  const last = V.pi === V.players.length - 1;
  return `<p class="mut" style="text-align:center">Player ${V.pi+1} of ${V.players.length}</p>
    <h1 style="text-align:center">Pass the phone to<br>${esc(V.players[V.pi].name)}</h1>${holdBox(V.role)}
    <button class="btn" onclick="send({t:'next'})">${last ? 'Everyone has seen it. Start!' : 'Hide and pass on'}</button>`;
}

function play(){
  const words = V.words.map((w,i) => `<div class="w" onclick="wc(${i},this)">${esc(w)}</div>`).join('');
  return `<div class="card"><div class="mut" style="text-align:center">Time left</div><div class="timer${left() < 30 ? ' hot' : ''}" id="tm">${fmt(left())}</div><div class="bar"><i id="tb" class="${left() < 30 ? 'hot' : ''}" style="width:${left()/(V.cfg.mins*60)*100}%"></i></div></div>
    ${V.role ? holdBox(V.role) : '<div class="card"><p>Everyone has their secret. Take turns asking each other questions.</p></div>'}
    <div class="card"><h2>${CATS[V.cat].icon} ${esc(V.cat)}</h2>
      <p class="mut">${guessing ? 'Tap the word to make your final guess.' : 'Tap a word to cross it off.'}</p>
      <div class="words${guessing ? ' g' : ''}">${words}</div></div>
    ${V.canGuess ? `<button class="btn alt" onclick="guessing=!guessing;render()">🎯 ${guessing ? 'Cancel guess' : 'I know the word'}</button>` : ''}
    <button class="btn red" onclick="send({t:'call'})">🚨 Call a vote</button>`;
}

function vote(){
  const me = V.players.find(p => p.id === V.you), n = V.players.filter(p => !p.gone), d = n.filter(p => p.voted).length;
  const btns = V.players.map((p,i) => (p.gone || (!V.local && p.id === V.you)) ? '' :
    `<button class="btn alt" onclick="vt(${i})" ${!V.local && me && me.voted ? 'disabled' : ''}>${av(p.name)}${esc(p.name)}</button>`).join('');
  return `<h1>🗳️ Who is the Spy?</h1>
    <p class="mut">${V.local ? 'Agree as a group, then tap the player you accuse.' : me && me.voted ? 'Vote locked in ✓ Waiting for the others…' : 'Tap the player you suspect.'}</p>
    ${btns}${V.local ? '' : `<p class="mut" style="text-align:center">${d} of ${n.length} voted</p>`}
    ${V.host && !V.local ? '<button class="btn red" onclick="send({t:\'force\'})">Show result now</button>' : ''}`;
}

function over(){
  const r = V.result, ag = r.win === 'agents';
  return `<div class="win" style="color:var(${ag ? '--grn' : '--red'})">${ag ? '🎉 Agents win!' : '🕵️ The Spy wins!'}</div>
    <p style="text-align:center">${esc(r.why)}</p>
    <div class="card"><h2>The reveal</h2>
      <div class="pl"><span>Spy</span><b>${esc(r.spy)}</b></div>
      <div class="pl"><span>${r.alt ? 'Agents’ word' : 'Secret word'}</span><b>${esc(r.secret)}</b></div>
      ${r.alt ? `<div class="pl"><span>Spy’s word</span><b>${esc(r.alt)}</b></div>` : ''}
      <div class="pl"><span>Category</span><b>${esc(r.cat)}</b></div></div>
    ${r.tally.length ? `<div class="card"><h2>Votes</h2>${r.tally.map(t => `<div class="pl"><span>${esc(t[0])}</span><b>${t[1]}</b></div>`).join('')}</div>` : ''}
    ${V.host ? '<button class="btn" onclick="send({t:\'again\'})">Play again</button>' : '<p class="mut" style="text-align:center">Waiting for the host to start another round…</p>'}
    <div class="link" onclick="location.reload()">Leave game</div>`;
}

/* ===================== SMALL HELPERS ===================== */
const av = n => `<span class="av" style="background:hsl(${Math.abs([...n].reduce((a,c) => (a*31 + c.charCodeAt(0)) | 0, 7)) % 360} 62% 68%)">${esc([...n][0].toUpperCase())}</span>`;
const left = () => Math.max(0, Math.round((V.endAt - Date.now()) / 1000));
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
let wl = null;
async function keepAwake(){ if(wl && !wl.released) return; try{ wl = await navigator.wakeLock.request('screen'); }catch(e){} }   // keeps the screen on during a round
const saveName = () => { try{ localStorage.setItem('sa-name', N.trim()); }catch(e){} };
function selAll(){ G.cfg.cats = G.cfg.cats.length === CN.length ? [] : [...CN]; sync(); }
function inv(b){
  const u = location.origin + location.pathname + '?room=' + V.code;
  if(navigator.share) navigator.share({title:'Secret Agent', text:'Join my game! Room '+V.code, url:u}).catch(() => {});
  else if(navigator.clipboard) navigator.clipboard.writeText(u).then(() => { b.textContent = 'Link copied ✓'; });
}

/* ===================== PRESS & HOLD + TIMER ===================== */
const setHold = on => { held = on; if(on) buzz(25); document.querySelectorAll('[data-hold]').forEach(el => el.classList.toggle('on', on)); };
document.addEventListener('pointerdown', e => { if(e.target.closest('[data-hold]')){ e.preventDefault(); setHold(true); } });
['pointerup','pointercancel'].forEach(t => document.addEventListener(t, () => setHold(false)));
window.addEventListener('blur', () => setHold(false));
document.addEventListener('contextmenu', e => { if(e.target.closest('[data-hold]')) e.preventDefault(); });

setInterval(() => {
  if(!V || V.phase !== 'play') return;
  const s = Math.max(0, Math.round((V.endAt - Date.now()) / 1000)), el = $('#tm');
  if(el){ el.textContent = fmt(s); el.classList.toggle('hot', s < 30); }
  const b = $('#tb'); if(b){ b.style.width = (s/(V.cfg.mins*60)*100)+'%'; b.classList.toggle('hot', s < 30); }
  if(s <= 0 && G && G.phase === 'play') startVote();   // time's up -> everyone votes
}, 500);

/* ===================== INSTALL AS AN APP (PWA) ===================== */
let dip = null;   // the browser's "install" prompt, once it offers one
addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; if(screen === 'home') render(); });
addEventListener('appinstalled', () => { dip = null; if(screen === 'home') render(); });
const isApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function install(){ if(dip){ dip.prompt(); dip = null; render(); } }
const installBox = () => isApp() ? '' : dip ? '<button class="btn alt" onclick="install()">⬇️ Install the app</button>'
  : /iphone|ipad/i.test(navigator.userAgent) ? '<p class="tag">To install: tap Share, then “Add to Home Screen”.</p>' : '';
if('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
